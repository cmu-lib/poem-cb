---
# "Keywords" page i.e. used for glossary
layout: page
---



{{ content }}


<div class="mt-4 mt-md-0 row clearspace-md" id="browseItems">
{%- assign glossary = site.data.poem-keywords | sort: "title" -%}
{% for item in glossary %}
        <div class="item col-lg-4 col-md-6 col-sm-6 mb-4" id="y{{ year }}">
        <a href="/keyword/{{item.title|downcase|replace: ' ', '+'}}" class="card active-green keyword-card">
        <div class="card-body text-center"> 
            <h3 class="card-title h4 clippy" id="keywords-to-titles">{{ item.title }}</h3>
            <p class="card-text">{{ item.creators_card }}</p>
            <p class="card-text clippy text-start">{{ item.description }}</p>
        </div>
        </a>
        </div>
            {% endfor %}
</div>
